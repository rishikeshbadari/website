<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishikesh Badari</title>
    <meta name="description" content="Rishikesh Badari - software engineer in San Francisco. Portfolio, projects, and photography.">
    <meta property="og:title" content="Rishikesh Badari">
    <meta property="og:description" content="Software engineer in San Francisco. Portfolio, projects, and photography.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#111111">

    <style>
        html { background-color: #111111; }
        body { opacity: 0; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"></noscript>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/projects.css">
</head>
<body>
    <nav class="side-nav">
        <a href="#hero" class="nav-link">Home</a>
        <a href="#projects" class="nav-link">Projects</a>
    </nav>

    <main>
        <section id="hero" class="section-hero">
            <div class="hero-mosaic" aria-hidden="true"></div>
            <div class="hero-overlay" aria-hidden="true"></div>
            <div class="hero-content">
                <div class="hero">
                    <h1 class="hero-title">Rishikesh Badari</h1>
                </div>
                <div class="hero-rule"></div>
                <div class="hero-meta">
                    <p class="hero-meta-desc">Software Engineer</p>
                    <div class="hero-meta-item">
                        <span class="meta-label">Location</span>
                        <span class="meta-value">Palo Alto, California</span>
                    </div>
                    <div class="hero-meta-item">
                        <span class="meta-label">Contact</span>
                        <span class="meta-value">
                            <a href="mailto:badari.rishikesh@gmail.com">Email</a>
                            <span class="meta-separator">/</span>
                            <a href="https://www.linkedin.com/in/rbadari/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                            <span class="meta-separator">/</span>
                            <a href="https://github.com/rishikeshbadari" target="_blank" rel="noopener noreferrer">GitHub</a>
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <section id="projects" class="page-section">
            <div class="section-container">
                <div class="section-head">
                    <h2 class="section-heading">Projects</h2>
                </div>
                <div class="projects-container" data-project-list></div>
            </div>
        </section>
    </main>

    <div class="project-modal" id="projectModal" role="dialog" aria-modal="true" aria-label="Project details">
        <div class="project-modal-content">
            <button class="project-modal-close" id="projectModalClose" aria-label="Close">&times;</button>
            <div class="project-modal-scroll">
                <div class="project-modal-readme">
                    <div class="readme-content" id="modalReadmeContent"></div>
                    <div class="project-links" id="modalProjectLinks"></div>
                </div>
                <div class="project-modal-demo" id="modalProjectDemo"></div>
            </div>
        </div>
    </div>

    <script defer src="data/gallery-data.js"></script>
    <script defer src="js/gallery-preload.js"></script>
    <script defer src="js/mosaic.js"></script>
    <script defer src="data/projects-data.js"></script>
    <script defer src="js/projects.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('a[href^="#"]').forEach(function(link) {
                link.addEventListener('click', function(event) {
                    var target = document.querySelector(link.getAttribute('href'));
                    if (!target) return;
                    event.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth' });
                });
            });
            document.body.style.transition = 'opacity 0.3s ease';
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
